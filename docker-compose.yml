services:
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-app-flask
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    # Provides a writable in-memory /tmp directory since the filesystem is read-only.
    tmpfs:
      - /tmp
    # Drops all Linux kernel capabilities — app runs with minimum privileges.
    cap_drop:
      - ALL
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge